{% extends 'base.html' %}

{% block content %}
    <h1>All Posts</h1>
    {% for post in posts %}
        <div class="card mb-3">
            <div class="card-body">
                <h3 class="card-title">{{ post.title }}</h3>
                <p class="card-text">{{ post.content[:100] }}...</p>
                <a href="{{ url_for('post', id=post.id) }}" class="btn btn-primary">Read More</a>
            </div>
        </div>
    {% else %}
        <p>No posts yet!</p>
    {% endfor %}
{% endblock %}
